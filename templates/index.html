<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Brain Tumor Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-3">Brain Tumor Detection</h1>
  <p class="text-muted">Academic prototype — not for clinical diagnosis.</p>
  <form class="card p-4" method="post" enctype="multipart/form-data">
    <input class="form-control mb-3" type="file" name="image" accept="image/*" required>
    <button class="btn btn-primary" type="submit">Analyze MRI</button>
  </form>
</div>
</body>
</html>
